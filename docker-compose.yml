services:
  synopsis:
    build: .
    image: synopsis-workplace:1.0.0
    container_name: synopsis-workplace
    ports:
      - "127.0.0.1:6090:6090"
    volumes:
      - synopsis_clips:/clips
    env_file:
      - path: ./.env
        required: false
      - path: ../../.env
        required: false
    environment:
      - PORT=6090
      - HOST=0.0.0.0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      - CLIP_OUTPUT_DIR=/clips
      - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-v4-flash}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6090/sante')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  synopsis_clips:
